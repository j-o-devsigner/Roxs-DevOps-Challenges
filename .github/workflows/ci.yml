name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      vote: ${{ steps.filter.outputs.vote }}
      vote_force_build: ${{ steps.check_vote_image.outputs.force_build }}
      result: ${{ steps.filter.outputs.result }}
      result_force_build: ${{ steps.check_result_image.outputs.force_build }}
      worker: ${{ steps.filter.outputs.worker }}
      worker_force_build: ${{ steps.check_worker_image.outputs.force_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vote:
              - 'app/vote/**'
            result:
              - 'app/result/**'
            worker:
              - 'app/worker/**'

      - id: check_vote_image
        run: |
          TAG=$(if [ "${GITHUB_REF_NAME}" == "master" ]; then echo "prod"; else echo "staging"; fi)
          REST=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/johndevsigner/roxs-voting-app-vote/tags/$TAG")
          if [ "$REST" -ne 200 ]; then
            echo "force_build=true" >> $GITHUB_OUTPUT
          else
            echo "force_build=false" >> $GITHUB_OUTPUT
          fi

      - id: check_result_image
        run: |
          TAG=$(if [ "${GITHUB_REF_NAME}" == "master" ]; then echo "prod"; else echo "staging"; fi)
          REST=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/johndevsigner/roxs-voting-app-result/tags/$TAG")
          if [ "$REST" -ne 200 ]; then
            echo "force_build=true" >> $GITHUB_OUTPUT
          else
            echo "force_build=false" >> $GITHUB_OUTPUT
          fi

      - id: check_worker_image
        run: |
          TAG=$(if [ "${GITHUB_REF_NAME}" == "master" ]; then echo "prod"; else echo "staging"; fi)
          REST=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/johndevsigner/roxs-voting-app-worker/tags/$TAG")
          if [ "$REST" -ne 200 ]; then
            echo "force_build=true" >> $GITHUB_OUTPUT
          else
            echo "force_build=false" >> $GITHUB_OUTPUT
          fi

  build-vote:
    name: Build Vote App
    needs: detect-changes
    if: needs.detect-changes.outputs.vote == 'true' || needs.detect-changes.outputs.vote_force_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine Docker tag
        id: docker_meta
        run: |
          if [ "${{ github.ref_name }}" == "master" ]; then echo "tag=prod" >> $GITHUB_OUTPUT; else echo "tag=staging" >> $GITHUB_OUTPUT; fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push vote app
        uses: docker/build-push-action@v6
        with:
          context: ./app/vote
          push: true
          tags: johndevsigner/roxs-voting-app-vote:${{ steps.docker_meta.outputs.tag }}

  build-result:
    name: Build Result App
    needs: detect-changes
    if: needs.detect-changes.outputs.result == 'true' || needs.detect-changes.outputs.result_force_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine Docker tag
        id: docker_meta
        run: |
          if [ "${{ github.ref_name }}" == "master" ]; then echo "tag=prod" >> $GITHUB_OUTPUT; else echo "tag=staging" >> $GITHUB_OUTPUT; fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push result app
        uses: docker/build-push-action@v6
        with:
          context: ./app/result
          push: true
          tags: johndevsigner/roxs-voting-app-result:${{ steps.docker_meta.outputs.tag }}

  build-worker:
    name: Build Worker App
    needs: detect-changes
    if: needs.detect-changes.outputs.worker == 'true' || needs.detect-changes.outputs.worker_force_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine Docker tag
        id: docker_meta
        run: |
          if [ "${{ github.ref_name }}" == "master" ]; then echo "tag=prod" >> $GITHUB_OUTPUT; else echo "tag=staging" >> $GITHUB_OUTPUT; fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push worker app
        uses: docker/build-push-action@v6
        with:
          context: ./app/worker
          push: true
          tags: johndevsigner/roxs-voting-app-worker:${{ steps.docker_meta.outputs.tag }}